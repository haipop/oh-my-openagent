name: get.omo.dev CI

on:
  push:
    branches: [master, dev]
    paths:
      - "packages/get-worker/**"
      - ".github/workflows/get-worker-ci.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "packages/get-worker/**"
      - "script/installer/**"
      - ".github/workflows/get-worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  worker:
    if: github.ref != 'refs/heads/feat/deepseek-harness'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: packages/get-worker
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check
      - name: Unit tests
        run: bun run test
      - name: Bundle dry run
        run: bunx wrangler deploy --dry-run --outdir dist
      - name: Write job summary
        if: always()
        shell: bash
        working-directory: .
        env:
          JOB_SUMMARY_TITLE: get.omo.dev worker checks
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Type-checks and unit-tests the get.omo.dev Worker.
            - Bundles the Worker with a wrangler dry run.
          JOB_SUMMARY_NEXT: Start with the first failing step.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
