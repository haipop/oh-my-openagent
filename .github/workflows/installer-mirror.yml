name: Installer channel maintenance (R2)
run-name: "${{ format('installer channel {0} {1}', inputs.op, inputs.channel) }}"

# Maintains the retained historical channel pointers in the private omo-releases R2 bucket behind
# get.omo.dev. A manual run with op set maintains one channel pointer (#11313): head prints what R2
# holds for it, recreate deletes it and writes `version` as a new object.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Installer channel to inspect or recreate"
        required: true
        type: choice
        default: latest
        options: [latest, beta]
      op:
        description: "Channel maintenance instead of a mirror: head inspects channels/<channel>, recreate deletes and rewrites it"
        type: choice
        default: none
        options: [none, head, recreate]
      version:
        description: "recreate only: the X.Y.Z[-pre] version to write into the channel; it must already be fully mirrored and fit the channel (latest takes only a stable version; beta takes either, since it is never older than latest)"
        type: string
        default: ""

# One group per channel so concurrent maintenance runs cannot interleave on the same key.
concurrency:
  group: installer-channel-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_RELEASES_ACCOUNT_ID: 6511ce566bfe27228f536a8fb9448be5

jobs:
  channel-maintenance:
    if: github.repository == 'code-yeongyu/oh-my-openagent' && github.event_name == 'workflow_dispatch' && (inputs.op == 'head' || inputs.op == 'recreate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: omo-releases-sl
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Channel ${{ inputs.op }} channels/${{ inputs.channel }}
        env:
          R2_ACCOUNT_ID: ${{ env.R2_RELEASES_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          OP: ${{ inputs.op }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(--op "$OP" --channel "$CHANNEL")
          if [ "$OP" = "recreate" ]; then args+=(--version "$VERSION"); fi
          bun script/installer/channel-maintenance.ts "${args[@]}"

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Installer channel ${{ inputs.op }} (${{ inputs.channel }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - head: prints the status, every response header and the body of a signed HEAD and GET of channels/<channel>, credentials redacted.
            - recreate: refuses a version that does not fit the channel or is not fully mirrored, then deletes channels/<channel>, writes the version as a new object and reads it back.
            - Each request runs once; nothing is retried or restored.
          JOB_SUMMARY_NEXT: Read the step log. If a recreate failed after its delete, rerun recreate with the same fully mirrored version.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
